services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: bms-app:latest
    container_name: bms-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bms

  # Worker untuk Job antrean (generate PDF Surat Jalan, Tanda Terima, Invoice)
  queue:
    image: bms-app:latest
    container_name: bms-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=300 --max-time=3600
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - bms

  # Scheduler Laravel (finance:mark-overdue setiap 00:05)
  scheduler:
    image: bms-app:latest
    container_name: bms-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - bms

  nginx:
    image: nginx:alpine
    container_name: bms-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8083}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - bms
      - shared-network

  mysql:
    image: mysql:8.0
    container_name: bms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - bms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bms

networks:
  bms:
    driver: bridge
  shared-network:
    external: true

volumes:
  bms_mysql_data:
